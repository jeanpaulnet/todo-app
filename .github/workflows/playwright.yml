name: Playwright E2E Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build Angular app
        run: npm run build

      - name: Run Playwright tests
        id: playwright
        run: npm run e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test results (JUnit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: playwright-results.xml
          retention-days: 30

      - name: Upload snapshot diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-diffs
          path: e2e/__snapshots__/
          retention-days: 7

      # ── Notify the commit author when tests fail ──────────────────────────
      - name: Get commit author email
        if: failure() && github.event_name == 'push'
        id: author
        run: |
          EMAIL=$(git log -1 --pretty=format:'%ae')
          echo "email=$EMAIL" >> $GITHUB_OUTPUT
          NAME=$(git log -1 --pretty=format:'%an')
          echo "name=$NAME" >> $GITHUB_OUTPUT

      - name: Send failure email via SendGrid
        if: failure() && github.event_name == 'push' && steps.author.outputs.email != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: false
          username: ${{ secrets.NOTIFY_EMAIL_USER }}
          password: ${{ secrets.NOTIFY_EMAIL_PASS }}
          to: ${{ steps.author.outputs.email }}
          from: "CI Bot <${{ secrets.NOTIFY_EMAIL_USER }}>"
          subject: "❌ Playwright tests failed on master — ${{ github.repository }}"
          body: |
            Hi ${{ steps.author.outputs.name }},

            The Playwright E2E tests failed for your push to master.

            Repository : ${{ github.repository }}
            Commit     : ${{ github.sha }}
            Message    : ${{ github.event.head_commit.message }}
            Run URL    : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Please review the attached Playwright report and fix the failing tests.

            — CI Bot
